<title>PST — Proposta de Solução Técnica · IOC/Fiocruz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --coral:#e47267; --coral-d:#c45a50; --coral-l:#f5e8e6;
  --ink:#333333; --stone:#8a8780; --cream:#e6e5c4; --sand:#d6d1af; --sage:#d7d8c5;
  --white:#FFFFFF; --surface:#faf9f5; --brand:#3d3933;
  --ok:#5a7a52; --ok-bg:#eaf0e8; --warn:#c45a50; --warn-bg:#f5e8e6;
  --gold:#8a7340; --gold-bg:#f5f0e0; --nav-h:60px; --ease-out:cubic-bezier(0.16,1,0.3,1);
}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--surface);overflow-x:hidden;}
#app-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--brand);z-index:1000;display:flex;align-items:center;padding:0 20px;border-bottom:2px solid var(--coral);box-shadow:0 2px 16px rgba(0,0,0,.15);}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:12px;color:#fff;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;padding-right:20px;border-right:1px solid rgba(255,255,255,.15);margin-right:6px;line-height:1.2;}
.nav-logo span{display:block;font-weight:400;font-size:10px;opacity:.5;letter-spacing:.12em;margin-top:2px;}
.nav-items{display:flex;align-items:center;gap:1px;overflow-x:auto;flex:1;scrollbar-width:none;padding:0 6px;}
.nav-items::-webkit-scrollbar{display:none;}
.nav-btn{font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.55);background:none;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.08);}
.nav-btn.active{color:#fff;background:rgba(228,114,103,.2);font-weight:600;border-bottom:2px solid var(--coral);}
.nav-dl{margin-left:auto;flex-shrink:0;padding-left:14px;border-left:1px solid rgba(255,255,255,.12);}
.btn-dl{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--coral);border:none;padding:7px 14px;border-radius:5px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all .18s;white-space:nowrap;}
.btn-dl:hover{background:var(--coral-d);transform:translateY(-1px);}
.btn-dl svg{width:13px;height:13px;}
#app-main{padding-top:var(--nav-h);min-height:100vh;}
.view-host{display:none;animation:fadeIn .35s var(--ease-out) both;}
.view-host.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

</nav>

  wifi:`<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>`,

  network:`<circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M5 16a7 7 0 0 1 7-7 7 7 0 0 1 7 7"/>`,
  download:`<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,

function svg(n,s=18,c='currentColor'){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;}

// ── Shared CSS injected into each shadow root ─────────────────────────────────
const BASE=`
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:host{
  --coral:#e47267;--coral-d:#c45a50;--coral-l:#f5e8e6;
  --ink:#333333;--stone:#8a8780;--cream:#e6e5c4;--sand:#d6d1af;--sage:#d7d8c5;
  --white:#FFFFFF;--surface:#faf9f5;--brand:#3d3933;
  --ok:#5a7a52;--ok-bg:#eaf0e8;--warn:#c45a50;--warn-bg:#f5e8e6;
  --gold:#8a7340;--gold-bg:#f5f0e0;
  font-family:'DM Sans',sans-serif;font-size:15px;color:#333;
}
.view{max-width:980px;margin:0 auto;padding:48px 32px 80px;}
.stag{display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);background:var(--coral-l);padding:4px 12px;border-radius:20px;margin-bottom:16px;}
h1.vt{font-family:'Syne',sans-serif;font-size:clamp(26px,3.5vw,40px);font-weight:800;color:var(--brand);line-height:1.1;margin-bottom:8px;letter-spacing:-.02em;}
h1.vt em{font-style:normal;color:var(--coral);}
.sub{font-size:15.5px;color:var(--stone);font-weight:300;margin-bottom:36px;max-width:620px;line-height:1.65;}
h2.sec{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:var(--brand);margin:36px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--sand);letter-spacing:-.01em;}
h2.sec:first-of-type{margin-top:0;}
h3.sub3{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--coral-d);margin:20px 0 8px;}
p.bd{font-size:14px;line-height:1.75;color:#333;margin-bottom:10px;}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:7px;margin:16px 0;font-size:13px;line-height:1.65;}
.note.warn{background:var(--warn-bg);border-left:4px solid var(--warn);}
.note.ok{background:var(--ok-bg);border-left:4px solid var(--ok);}
.note.info{background:var(--cream);border-left:4px solid var(--coral);}
.note.dark{background:#f0ede6;border-left:4px solid var(--brand);}
.ni{flex-shrink:0;display:flex;align-items:center;margin-top:1px;}
.ni svg{width:16px;height:16px;}
.note.warn .ni,.note.warn strong{color:var(--warn);}
.note.ok .ni,.note.ok strong{color:var(--ok);}
.note.info .ni,.note.info strong{color:var(--coral);}
.note.dark .ni,.note.dark strong{color:var(--brand);}
.nt{flex:1;}
/* Tables */
.tw{overflow-x:auto;margin:12px 0 24px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--brand);color:#fff;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:9px 13px;text-align:left;}
th:first-child{border-radius:9px 0 0 0;}th:last-child{border-radius:0 9px 0 0;}
td{padding:9px 13px;vertical-align:top;border-bottom:1px solid #ede9e0;line-height:1.5;font-size:13px;}
tr:last-child td{border-bottom:none;}
tr:nth-child(even) td{background:var(--sage);}
tr:hover td{background:var(--cream)!important;transition:background .12s;}
.c-ok{color:var(--ok);font-weight:600;}
.c-warn{color:var(--warn);font-weight:600;}
.c-coral{color:var(--coral);font-weight:600;}
.c-brand{color:var(--brand);font-weight:600;}
.hl{background:var(--ok-bg)!important;}
/* Code blocks */
pre{background:#2a2724;color:#e6e5c4;border-radius:8px;padding:16px;overflow-x:auto;font-family:'DM Mono',monospace;font-size:12px;line-height:1.65;margin:12px 0;}
code{font-family:'DM Mono',monospace;font-size:12px;background:#f0ede6;padding:2px 6px;border-radius:4px;color:var(--brand);}
/* Bullet list */
ul.bl{list-style:none;padding:0;margin:10px 0;}
ul.bl li{padding:5px 0 5px 18px;position:relative;font-size:13.5px;line-height:1.6;border-bottom:1px solid #f0ede6;}
ul.bl li:last-child{border-bottom:none;}
ul.bl li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--coral);}
/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0;}
.card{background:#fff;border:1px solid #ddd8cc;border-radius:10px;padding:18px;transition:box-shadow .2s,transform .2s;}
.card:hover{box-shadow:0 4px 20px rgba(61,57,51,.1);transform:translateY(-2px);}
.card-t{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--brand);margin-bottom:6px;display:flex;align-items:center;gap:7px;}
.card-t svg{width:15px;height:15px;flex-shrink:0;}
.card-b{font-size:12.5px;color:var(--stone);line-height:1.6;}
.c-coral-top{border-top:3px solid var(--coral);}
.c-ok-top{border-top:3px solid var(--ok);}
.c-brand-top{border-top:3px solid var(--brand);}
.c-warn-top{border-top:3px solid var(--warn);}
/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-coral{background:var(--coral-l);color:var(--coral-d);}
.b-brand{background:#ede9e0;color:var(--brand);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
/* Timeline */
.tl{margin:20px 0;}
.tli{display:grid;grid-template-columns:90px 1fr;gap:0 20px;position:relative;}
.tli::before{content:'';position:absolute;left:88px;top:36px;bottom:-1px;width:2px;background:var(--sand);}
.tli:last-child::before{display:none;}
.tlp{padding:14px 0;text-align:right;font-family:'Syne',sans-serif;font-size:11.5px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-transform:uppercase;}
.tlp span{display:block;font-family:'DM Mono',monospace;font-size:9.5px;font-weight:400;color:var(--stone);margin-top:2px;}
.tldot{position:absolute;left:79px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--coral);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--coral);}
.tlc{padding:14px 0 20px 20px;border-left:2px solid var(--sand);}
.tlt{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:5px;}
.tld{font-size:12.5px;color:var(--stone);line-height:1.6;}
.tlbadge{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;background:var(--ok-bg);color:var(--ok);}
.tlbadge svg{width:11px;height:11px;}
/* Spec box */
.spec{background:#fff;border:1px solid #ddd8cc;border-radius:10px;padding:18px 20px;margin:12px 0;}
.spec-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--brand);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.spec-title svg{width:15px;height:15px;}
/* Responsibility table */
.resp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;}
@media(max-width:600px){.resp-grid{grid-template-columns:1fr;}}
.resp-col{background:#fff;border:1px solid #ddd8cc;border-radius:10px;padding:18px;}
.resp-col-brand{border-top:3px solid var(--brand);}
.resp-col-coral{border-top:3px solid var(--coral);}
.resp-title{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.resp-title svg{width:15px;height:15px;}
.resp-col-brand .resp-title{color:var(--brand);}
.resp-col-coral .resp-title{color:var(--coral);}
/* SLA table row colors */
.sla-crit{background:#fdf0ee!important;color:var(--warn);font-weight:600;}
.sla-high{background:#f5f3ed!important;}
/* Pipeline */
.pipeline{display:flex;align-items:center;gap:0;margin:16px 0;overflow-x:auto;padding-bottom:4px;}
.pipe-step{flex-shrink:0;background:#fff;border:1.5px solid #ddd8cc;border-radius:8px;padding:10px 14px;text-align:center;min-width:100px;}
.pipe-step-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--brand);margin-bottom:3px;}
.pipe-step-sub{font-size:10px;color:var(--stone);line-height:1.4;}
.pipe-arrow{color:var(--sand);font-size:18px;padding:0 4px;flex-shrink:0;}
.pipe-step.ok{border-color:var(--ok);background:var(--ok-bg);}
.pipe-step.ok .pipe-step-title{color:var(--ok);}
.pipe-step.coral{border-color:var(--coral);background:var(--coral-l);}
.pipe-step.coral .pipe-step-title{color:var(--coral-d);}
/* Checklist */
.checklist{margin:12px 0;}
.ci{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;background:#fff;border:1px solid #ddd8cc;border-radius:7px;margin-bottom:6px;}
.ci svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--ok);}
.ci-text{font-size:13.5px;line-height:1.55;}
.ci-text strong{color:var(--brand);}
/* Divider */
hr.dv{border:none;border-top:1px solid #e8e3d8;margin:28px 0;}
/* Monospace label */
.mono{font-family:'DM Mono',monospace;font-size:12px;color:var(--brand);}
`;

function N(t,type='info',ic='info'){return `<div class="note ${type}"><span class="ni">${svg(ic,16)}</span><span class="nt">${t}</span></div>`;}
function T(h,rows,hl=-1){
  const ths=h.map(x=>`<th>${x}</th>`).join('');
  const trs=rows.map(r=>`<tr>${r.map((c,i)=>{
    let cls='';
    if(i===hl)cls=' class="hl"';
    if(c==='Crítico')cls=' class="c-warn"';
    if(c==='Alto')cls=' class="c-warn"';
    if(c==='Médio')cls=' class="c-coral"';
    if(c==='Baixo')cls=' class="c-ok"';
    if(c==='Sim')cls=' class="c-ok"';
    if(c==='Obrigatório')cls=' class="c-coral"';
    if(c==='✓')cls=' class="c-ok"';
    return `<td${cls}>${c}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tw"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}
function BL(items){return `<ul class="bl">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;}
function pipe(steps){
  return `<div class="pipeline">${steps.map((s,i)=>`
    <div class="pipe-step ${s.cls||''}">${s.icon?`<div style="margin-bottom:4px">${svg(s.icon,14,s.cls==='ok'?'#5a7a52':s.cls==='coral'?'#c45a50':'#3d3933')}</div>`:''}
      <div class="pipe-step-title">${s.title}</div>
      <div class="pipe-step-sub">${s.sub}</div>

<h2 class="sec">5.3 Script de Backup Recomendado</h2>
<pre>#!/bin/bash
# /etc/cron.d/ioc-backup — executa a cada 6 horas
BACKUP_DIR="/var/backups/ioc-portal"
DATE=$(date +%Y%m%d_%H%M)

# 1. Dump do banco de dados
docker exec ioc-mysql mysqldump -u root -p${DB_PASSWORD} ioc_portal \
  | gzip | openssl enc -aes-256-cbc -k ${BACKUP_KEY} \
  > "${BACKUP_DIR}/db_${DATE}.sql.gz.enc"

# 2. Arquivos de mídia
tar czf - /var/www/html/storage/app/public \
  | openssl enc -aes-256-cbc -k ${BACKUP_KEY} \
  > "${BACKUP_DIR}/media_${DATE}.tar.gz.enc"

# 3. Remove backups com mais de 30 dias
find "${BACKUP_DIR}" -mtime +30 -delete

# 4. Verifica integridade (checksum)
sha256sum "${BACKUP_DIR}/db_${DATE}.sql.gz.enc" >> "${BACKUP_DIR}/checksums.txt"</pre>

const VIEWS=[
  {id:'capa',    label:'Capa'},
  {id:'arch',    label:'1. Arquitetura'},
  {id:'infra',   label:'2. Infraestrutura'},
  {id:'deploy',  label:'3. Deploy / CI/CD'},
  {id:'sec',     label:'4. Segurança / LGPD'},
  {id:'sla',     label:'5. RNF / SLA'},
  {id:'api',     label:'6. API / Integrações'},
  {id:'db',      label:'7. Banco de Dados'},
  {id:'train',   label:'8. Capacitação'},
  {id:'resp',    label:'9. Responsabilidades'},
  {id:'tests',   label:'10. Testes'},
];
const R={capa:vCapa,arch:vArch,infra:vInfra,deploy:vDeploy,sec:vSec,sla:vSla,api:vApi,db:vDb,train:vTrain,resp:vResp,tests:vTests};
const main=document.getElementById('app-main'),ni=document.getElementById('nav-items');
const H={},B={};
VIEWS.forEach(({id,label})=>{
  const b=document.createElement('button');
  b.className='nav-btn';b.textContent=label;b.dataset.view=id;
  b.addEventListener('click',()=>go(id));ni.appendChild(b);B[id]=b;
  const h=document.createElement('div');
  h.className='view-host';h._r=false;main.appendChild(h);H[id]=h;
});
function go(id){
  Object.values(H).forEach(h=>h.classList.remove('active'));
  Object.values(B).forEach(b=>b.classList.remove('active'));
  H[id].classList.add('active');B[id].classList.add('active');
  if(!H[id]._r){
    const s=H[id].attachShadow({mode:'open'});
    s.innerHTML=R[id]();
    H[id]._r=true;
  }
  window.scrollTo({top:0,behavior:'smooth'});
  history.replaceState(null,'',`#${id}`);
}
const init=(location.hash.slice(1) in R)?location.hash.slice(1):'capa';
go(init);
window.addEventListener('popstate',()=>{const id=location.hash.slice(1);if(id in R)go(id);});
</script>
